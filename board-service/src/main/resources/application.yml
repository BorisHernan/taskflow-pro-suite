server:
  # Render (y plataformas similares) inyectan la variable PORT en runtime.
  port: ${PORT:8081}

spring:
  application:
    name: board-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/taskflow
    username: taskflow
    password: taskflow
    pool:
      # Neon cierra las conexiones tras ~5 min sin uso; si el pool las reutiliza
      # falla la validación y el request devuelve 500. Descartarlas antes evita eso.
      max-idle-time: 2m

  flyway:
    # Flyway no soporta R2DBC directamente, usa JDBC solo para migraciones
    url: jdbc:postgresql://localhost:5432/taskflow
    user: taskflow
    password: taskflow
    locations: classpath:db/migration

app:
  auth:
    # En producción, definir JWT_SECRET (32+ caracteres); sin ella cada arranque invalida las sesiones.
    jwt-secret: ${JWT_SECRET:}
    # Clave pública de las cuentas demo (se muestra en la pantalla de login).
    demo-password: ${DEMO_PASSWORD:demo1234}
  cors:
    # Lista separada por comas. En producción, sobreescribir con la variable
    # de entorno ALLOWED_ORIGINS apuntando al dominio real del frontend.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  demo:
    # Las cuentas demo son públicas: el límite por IP frena el abuso al crear tareas a mano.
    # El cron es la reposición nocturna de lo agotado.
    max-tasks-per-ip: ${MAX_TASKS_PER_IP:10}
    # Por defecto, una vez al día a las 03:00 UTC (poco tráfico esperado, es un demo de CV).
    reset-cron: ${DEMO_RESET_CRON:0 0 3 * * *}

management:
  endpoints:
    web:
      # Nunca agregar env/configprops/beans aquí: expondrían la password de la BD
      # y otras configs sensibles vía variables de entorno.
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: TaskFlow App — board-service
    description: API reactiva (WebFlux + R2DBC) del tablero kanban, con SSE en tiempo real

logging:
  level:
    org.springframework.r2dbc: INFO
