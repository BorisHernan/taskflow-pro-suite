<a class="saltar" href="#contenido">Saltar al contenido</a>

@if (!enGestion()) {
  <header class="app-header">
    <nav class="app-nav" aria-label="Principal">
      @if (enTienda()) {
        <a class="app-marca marca-tienda" routerLink="/tienda" aria-label="Quechuti, supermercado online: ir al inicio de la tienda">
          <img src="img/quechuti.svg" alt="" width="32" height="32" />
          <span>
            <strong>Quechuti</strong>
            <small>Supermercado</small>
          </span>
        </a>
      } @else {
        <a class="app-marca" routerLink="/" aria-label="TaskFlow, inicio">
          <img src="favicon.svg?v=4" alt="" width="28" height="28" />
          TaskFlow
        </a>
      }

      <div class="app-buscar">
        @defer {
          <app-menu-categorias />
        }
        <form class="app-busqueda" role="search" (submit)="buscar($event, caja.value)">
          <label class="sr-only" for="buscar-global">Buscar en la tienda</label>
          <input #caja id="buscar-global" type="search" placeholder="Buscar en Quechuti" autocomplete="off" [value]="consulta()" />
          <button type="submit" aria-label="Buscar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          </button>
        </form>
      </div>

      <div class="app-nav-acciones">
        @defer {
          <app-boton-carrito data-tour="carrito" />
        }
        <app-selector-tema />
        @if (sesion.activa()) {
          <a class="btn btn-primary btn-sm" routerLink="/gestion">Ir a la gestión</a>
        } @else {
          <a class="btn btn-primary btn-sm" routerLink="/ingresar">Ingresar</a>
        }
      </div>
    </nav>

  </header>
}

<div id="contenido" tabindex="-1">
  <router-outlet></router-outlet>
</div>

<app-avisos />
<app-confirmacion />
@if (!enMonitor) {
  <app-tour />
  <app-telefono-empleado />
  <app-monitor />
}
