<a class="saltar" href="#contenido">Saltar al contenido</a>

@if (!enGestion()) {
  <header class="app-header">
    <nav class="app-nav" aria-label="Principal">
      <a class="app-marca" routerLink="/" aria-label="TaskFlow, inicio">
        <img src="favicon.svg?v=4" alt="" width="28" height="28" />
        TaskFlow
      </a>

      <div class="app-nav-links">
        <a routerLink="/tienda" routerLinkActive="active">Tienda online</a>
        <a routerLink="/arena" routerLinkActive="active">Arena</a>
      </div>

      <div class="app-nav-acciones">
        <app-selector-tema />
        @if (sesion.activa()) {
          <a class="btn btn-primary btn-sm" routerLink="/gestion">Ir a la gestión</a>
        } @else {
          <a class="btn btn-primary btn-sm" routerLink="/ingresar">Ingresar</a>
        }
      </div>
    </nav>

  </header>
}

<div id="contenido" tabindex="-1">
  <router-outlet></router-outlet>
</div>

<app-avisos />
<app-confirmacion />
@if (!enMonitor) {
  <app-tour />
  <app-telefono-empleado />
  <app-monitor />
}
