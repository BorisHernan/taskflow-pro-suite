<header class="app-header">
  <nav class="app-nav" aria-label="Principal">
    <a class="app-marca" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <img src="favicon.svg" alt="" width="26" height="26" />
      TaskFlow
    </a>

    <div class="app-nav-links">
      <a routerLink="/tablero" routerLinkActive="active" data-seccion="tablero"><app-icono nombre="tablero" [tamano]="17" />Tablero</a>
      <a routerLink="/tienda" routerLinkActive="active" data-seccion="tienda"><app-icono nombre="tienda" [tamano]="17" />Tienda</a>
      <a routerLink="/estadisticas" routerLinkActive="active" data-seccion="estadisticas"><app-icono nombre="estadisticas" [tamano]="17" />Estadísticas</a>
      <a routerLink="/arena" routerLinkActive="active" data-seccion="arena"><app-icono nombre="arena" [tamano]="17" />Arena</a>
    </div>

    <button
      type="button"
      class="btn btn-icon theme-toggle"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      <app-icono [nombre]="themeService.theme() === 'dark' ? 'sol' : 'luna'" />
    </button>
  </nav>

  <app-guia-recorrido></app-guia-recorrido>
</header>

<router-outlet></router-outlet>
