<header class="app-header">
  <nav class="app-nav" aria-label="Principal">
    <a class="app-marca" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <img src="favicon.svg?v=3" alt="" width="26" height="26" />
      TaskFlow
    </a>

    <div class="app-nav-links">
      @if (sesion.activa()) {
        <a routerLink="/gestion" routerLinkActive="active" data-seccion="gestion"><app-icono nombre="resumen" [tamano]="17" />Gestión</a>
      } @else {
        <a routerLink="/ingresar" routerLinkActive="active" data-seccion="gestion"><app-icono nombre="persona" [tamano]="17" />Ingresar</a>
      }
      <a routerLink="/tienda" routerLinkActive="active" data-seccion="tienda"><app-icono nombre="tienda" [tamano]="17" />Tienda online</a>
      <a routerLink="/arena" routerLinkActive="active" data-seccion="arena"><app-icono nombre="arena" [tamano]="17" />Arena</a>
    </div>

    <button
      type="button"
      class="btn btn-icon theme-toggle"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      <app-icono [nombre]="themeService.theme() === 'dark' ? 'sol' : 'luna'" />
    </button>
  </nav>

  <app-guia-recorrido></app-guia-recorrido>
</header>

<router-outlet></router-outlet>
